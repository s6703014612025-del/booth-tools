<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FX Turbulence Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3EA;--fg:#14284B;--card:#FFFFFF;--line:#C9C2B0;--accent:#B94E00;--orange:#F28C28;--navy:#14284B;--on-navy:#FFFFFF;--muted:#4A5568;--bad:#B3261E;--good:#1B6E3C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1D38;--fg:#F7F3EA;--card:#17294A;--line:#34496E;--accent:#F5A04D;--navy:#F7F3EA;--on-navy:#14284B;--muted:#C5CCDA;--bad:#FF8A80;--good:#7FD6A0}}
:root[data-theme="dark"]{--bg:#0E1D38;--fg:#F7F3EA;--card:#17294A;--line:#34496E;--accent:#F5A04D;--navy:#F7F3EA;--on-navy:#14284B;--muted:#C5CCDA;--bad:#FF8A80;--good:#7FD6A0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:17px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:24px 20px 40px}
h1,h2,.d{font-family:'Prompt','Noto Sans Thai',sans-serif;font-weight:700;margin:0;line-height:1.25}
.eb{font-family:'Prompt',sans-serif;font-weight:500;font-size:13px;letter-spacing:3px;color:var(--accent)}
.hero{background:#14284B;color:#fff;padding:28px 22px;border-bottom:6px solid var(--orange);margin-bottom:20px}
.hero h1{font-size:34px;margin:8px 0}.hero p{margin:0;color:#E4DFD3}
.bar{height:8px;background:var(--line);margin:8px 0 22px}.bar>div{height:100%;background:var(--orange);transition:width .25s}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--line);padding:14px 16px;margin:0 0 12px;min-height:52px;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--orange);outline:none}
.opt:disabled{cursor:default;opacity:.9}
.opt.ok{border-color:var(--good);border-width:3px}.opt.no{border-color:var(--bad);border-width:3px}
.btn{font-family:'Prompt',sans-serif;font-weight:700;font-size:18px;background:var(--orange);color:#14284B;border:0;padding:14px 24px;min-height:52px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--fg)}
.box{background:var(--card);border:2px solid var(--fg);padding:16px 18px;margin:0 0 16px}
.big{font-family:'Prompt',sans-serif;font-weight:700;font-size:28px}
.tag{display:inline-block;font-family:'Prompt',sans-serif;font-weight:700;background:var(--navy);color:var(--on-navy);padding:2px 12px;margin-right:6px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row .lb{width:96px;font-size:15px;line-height:1.3}
.row .b{height:30px}.row .v{font-family:'Prompt',sans-serif;font-weight:700;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.stamp{width:170px;height:170px;border:6px double var(--accent);border-radius:50%;color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);margin:10px auto 18px;font-family:'Prompt',sans-serif;font-weight:700;text-align:center}
.note{font-size:14px;color:var(--muted);margin-top:22px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<script>
var app=document.getElementById("app");
var P0=35, USD=1000, score=0, rd=0;
var rounds=[{r:10,fx:32}];
var pool=[{r:0,fx:32},{r:-5,fx:38},{r:20,fx:33}];
rounds.push(pool[Math.floor(Math.random()*pool.length)]);
var paths=[[35,34,33,32],[35,36,37,38],[35,33,36,34]];
function f(n,d){return (n>=0?"+":"")+n.toFixed(d===undefined?1:d)+"%"}
function th(n){return Math.round(n).toLocaleString("en-US")}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(h){app.innerHTML=h;window.scrollTo(0,0)}
function head(step,n){return '<div class="eb">ด่าน '+step+' จาก 3</div><div class="bar"><div style="width:'+(n/3*100)+'%"></div></div>'}

function intro(){
 score=0;rd=0;
 show('<div class="hero"><div class="eb" style="color:#E8B84A">GLOBAL CITIZEN INVESTMENT</div><h1>FX Turbulence<br>Game</h1><p>3 ด่าน ประมาณ 2 นาที ดูว่าค่าเงินกินกำไรหุ้นนอกของคุณได้แค่ไหน</p></div>'+
 '<div class="box">ซื้อหุ้นมูลค่า <b>1,000 ดอลลาร์</b> ตอนที่ <b>1 ดอลลาร์ = 35 บาท</b> (ใช้เงิน 35,000 บาท)</div>'+
 '<button class="btn" id="go" type="button">เริ่มเช็กอิน</button>');
 document.getElementById("go").onclick=guess;
}

function calc(x){var usd=USD*(1+x.r/100);var baht=usd*x.fx;return {usd:usd,baht:baht,real:(baht/(USD*P0)-1)*100}}

function guess(){
 var x=rounds[rd],c=calc(x),real=Math.round(c.real*10)/10;
 var cands=[x.r,-real,real+8,real-8,0,x.r+10,real+15],opts=[{v:real,ok:true}];
 cands.forEach(function(v){v=Math.round(v*10)/10;if(opts.length<4&&opts.every(function(o){return Math.abs(o.v-v)>=1.5}))opts.push({v:v,ok:false})});
 shuffle(opts);
 show(head(rd+1,rd)+'<h2 style="font-size:22px;margin-bottom:12px">หุ้นขึ้นลง '+f(x.r,0)+' และบาทเป็น '+x.fx+' บาท/ดอลลาร์</h2>'+
 '<div class="box">ซื้อ 1,000 ดอลลาร์ ที่ 35 บาท แล้วขายตอน <b>'+x.fx+' บาท</b><br>กำไร (หรือขาดทุน) จริงเป็นบาทประมาณเท่าไร?</div><div id="o"></div>');
 var box=document.getElementById("o");
 opts.forEach(function(o){var b=document.createElement("button");b.type="button";b.className="opt";b.textContent="ประมาณ "+f(o.v);b.onclick=function(){reveal(x,c,o.ok)};box.appendChild(b)});
}

function bar(label,v,max){
 var w=Math.max(4,Math.abs(v)/max*100);
 return '<div class="row"><div class="lb">'+label+'</div><div style="flex:1"><div class="b" style="width:'+w+'%;background:'+(v<0?'var(--bad)':'var(--orange)')+'"></div></div><div class="v" style="color:'+(v<0?'var(--bad)':'var(--accent)')+'">'+f(v)+'</div></div>';
}
function reveal(x,c,ok){
 if(ok)score++;
 var max=Math.max(Math.abs(x.r),Math.abs(c.real),1);
 show(head(rd+1,rd+1)+'<h2 style="font-size:24px;margin-bottom:12px">'+(ok?'ถูกต้อง!':'ใกล้เคียงแล้ว มาดูผลจริง')+'</h2>'+
 '<div class="box"><div>หุ้น '+f(x.r,0)+' ➜ มูลค่า '+th(c.usd)+' ดอลลาร์</div><div>แลกกลับที่ '+x.fx+' บาท ➜ <b>'+th(c.baht)+' บาท</b></div><div style="margin-top:10px">'+bar('ผลของหุ้น',x.r,max)+bar('กำไรจริงเป็นบาท',c.real,max)+'</div></div>'+
 '<p>'+(Math.abs(c.real-x.r)>5?'ค่าเงินเปลี่ยนผลลัพธ์ไปมาก ทั้งที่หุ้นไม่ได้เปลี่ยน':'ค่าเงินมีผลต่อกำไรจริงเสมอ')+' ลองใส่ตัวเลขเดียวกันในเครื่องคำนวณที่บูธ</p>'+
 '<button class="btn" id="nx" type="button">'+(rd<rounds.length-1?'ข้อต่อไป':'ไปด่านป้องกันความเสี่ยง')+'</button>');
 document.getElementById("nx").onclick=function(){if(rd<rounds.length-1){rd++;guess()}else protect()};
}

var pick=null;
function protect(){
 show(head(3,2)+'<h2 style="font-size:22px;margin-bottom:12px">ด่านสุดท้าย: จะรับมือค่าเงินอย่างไร?</h2>'+
 '<div class="box">คุณมีเงิน <b>40,000 บาท</b> จะลงทุนในหุ้นที่ราคาคงที่ตลอด 4 เดือน แล้วขายตอนสิ้นเดือนที่ 4 ค่าเงินจะเป็นอย่างไรยังไม่รู้ คุณเลือกวิธีไหน?</div><div id="o"></div>');
 var box=document.getElementById("o");
 [["lump","ซื้อทั้งหมดครั้งเดียวในเดือนที่ 1"],["dca","ทยอยซื้อเดือนละ 10,000 บาท (DCA)"],["hedge","ซื้อครั้งเดียว และล็อกอัตราแลกเปลี่ยน (Hedge)"]].forEach(function(o){
  var b=document.createElement("button");b.type="button";b.className="opt";b.textContent=o[1];b.onclick=function(){pick=o[0];outcome()};box.appendChild(b)});
}
function sim(p){
 var lump=40000/p[0]*p[3];
 var u=0;p.forEach(function(r){u+=10000/r});
 return {lump:lump,dca:u*p[3],hedge:40000*0.99};
}
function outcome(){
 var p=paths[Math.floor(Math.random()*paths.length)],s=sim(p);
 var names={lump:"ซื้อครั้งเดียว",dca:"ทยอยซื้อ (DCA)",hedge:"Hedge (สมมติต้นทุน 1%)"};
 var rows=["lump","dca","hedge"].map(function(k){var pc=(s[k]/40000-1)*100;
  return '<tr><td>'+(k===pick?'<b>'+names[k]+' (คุณเลือก)</b>':names[k])+'</td><td>'+th(s[k])+'</td><td style="color:'+(pc<0?'var(--bad)':'var(--good)')+'"><b>'+f(pc)+'</b></td></tr>'}).join("");
 var dir=p[3]<p[0]?"บาทแข็งขึ้น":(p[3]>p[0]?"บาทอ่อนลง":"ค่าเงินแกว่ง");
 show(head(3,3)+'<h2 style="font-size:22px;margin-bottom:12px">เส้นทางค่าเงินคราวนี้: '+p.join(" ➜ ")+'</h2>'+
 '<div class="box"><div style="margin-bottom:8px">'+dir+' (ราคาหุ้นคงที่ ผลต่างมาจากค่าเงินล้วน ๆ)</div><table><tr><th>วิธี</th><th>ได้กลับ (บาท)</th><th>ผล</th></tr>'+rows+'</table></div>'+
 '<p>ข้อสังเกต: ถ้าบาทแข็ง DCA และ Hedge เจ็บน้อยกว่า แต่ถ้าบาทอ่อน การซื้อครั้งเดียวอาจได้มากกว่า ไม่มีวิธีไหนชนะทุกสถานการณ์ DCA และ Hedge ช่วยลดความผันผวน ไม่ได้การันตีกำไร และ Hedge มีต้นทุน</p>'+
 '<button class="btn" id="fin" type="button">รับตราประทับ</button> <button class="btn ghost" id="re" type="button">ลองอีกเส้นทาง</button>');
 document.getElementById("fin").onclick=finish;
 document.getElementById("re").onclick=protect;
}
function finish(){
 show('<div class="eb">YOUR BOARDING PASS</div><div class="stamp"><div style="font-size:15px;letter-spacing:2px">FX CHECKED</div><div style="font-size:34px">✓</div><div style="font-size:13px">GLOBAL CITIZEN</div></div>'+
 '<div class="box" style="text-align:center"><div class="big">'+score+' / '+rounds.length+'</div><div>ข้อที่เดากำไรจริงถูก</div></div>'+
 '<p style="text-align:center">แสดงหน้านี้ให้ทีมงานเพื่อรับตราประทับบน Boarding Pass</p>'+
 '<button class="btn ghost" id="again" type="button" style="display:block;margin:0 auto">เล่นใหม่</button>'+
 '<p class="note">เพื่อการศึกษาเท่านั้น ไม่ใช่คำแนะนำการลงทุน การลงทุนมีความเสี่ยง ผู้ลงทุนควรศึกษาข้อมูลก่อนตัดสินใจ ตัวเลขในเกมเป็นการจำลอง</p>');
 document.getElementById("again").onclick=function(){rounds=[{r:10,fx:32}];rounds.push(pool[Math.floor(Math.random()*pool.length)]);intro()};
}
intro();
</script>
</body>
</html>
